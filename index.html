<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><No Doubt> Cupping Note</title>
    <style>
        :root {
            --primary-color: #1a1a1a;
            --accent-color: #d35400;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-weight: 900;
            letter-spacing: -1px;
        }
        /* 원두 정보 표시 영역 */
        .bean-display {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 1.1em;
        }
        .form-section, .dashboard-section {
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        /* 초기에 대시보드는 숨겨둡니다 (블라인드 테스트) */
        .dashboard-section {
            display: none; 
        }
        .input-group { margin-bottom: 20px; }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .input-group input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
        }
        .slider-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        .slider-group label {
            flex: 1;
            font-weight: 600;
        }
        .slider-group input[type="range"] {
            flex: 2;
            margin: 0 10px;
        }
        .slider-group span {
            width: 40px;
            text-align: right;
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.1em;
        }
        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .tag {
            padding: 8px 14px;
            background: #e9ecef;
            border-radius: 20px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tag.selected {
            background: var(--primary-color);
            color: white;
        }
        .total-score {
            font-size: 1.8em;
            text-align: center;
            font-weight: bold;
            margin: 25px 0;
            color: var(--accent-color);
        }
        button.submit-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
        }
        .card {
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #fafafa;
        }
        .card h3 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1>☕ &lt;No Doubt&gt; Cupping Note</h1>

    <!-- ========================================================= -->
    <!-- 💡 수정하는 곳: 아래 글씨를 매번 새로운 원두/배치로 바꿔주세요 💡 -->
    <!-- ========================================================= -->
    <div class="bean-display" id="currentBeanInfo">
        Ethiopia Yirgacheffe Washed (Batch #001)
    </div>
    <!-- ========================================================= -->

    <!-- 커핑 폼 영역 -->
    <div class="form-section" id="formSection">
        <div class="input-group">
            <label>평가자 이름</label>
            <input type="text" id="cupperName" placeholder="팀원 이름을 입력하세요 (예: Mason)">
        </div>

        <h3 style="margin-top: 30px;">Score Evaluation</h3>
        
        <div class="slider-group">
            <label>Aroma</label>
            <input type="range" class="score-slider" min="6" max="10" step="0.25" value="8" oninput="updateScore(this)">
            <span>8.00</span>
        </div>
        <div class="slider-group">
            <label>Flavor</label>
            <input type="range" class="score-slider" min="6" max="10" step="0.25" value="8" oninput="updateScore(this)">
            <span>8.00</span>
        </div>
        <div class="slider-group">
            <label>Aftertaste</label>
            <input type="range" class="score-slider" min="6" max="10" step="0.25" value="8" oninput="updateScore(this)">
            <span>8.00</span>
        </div>
        <div class="slider-group">
            <label>Acidity</label>
            <input type="range" class="score-slider" min="6" max="10" step="0.25" value="8" oninput="updateScore(this)">
            <span>8.00</span>
        </div>
        <div class="slider-group">
            <label>Body</label>
            <input type="range" class="score-slider" min="6" max="10" step="0.25" value="8" oninput="updateScore(this)">
            <span>8.00</span>
        </div>
        <div class="slider-group">
            <label>Balance</label>
            <input type="range" class="score-slider" min="6" max="10" step="0.25" value="8" oninput="updateScore(this)">
            <span>8.00</span>
        </div>
        <div class="slider-group">
            <label>Overall</label>
            <input type="range" class="score-slider" min="6" max="10" step="0.25" value="8" oninput="updateScore(this)">
            <span>8.00</span>
        </div>

        <h3 style="margin-top: 30px;">Tasting Notes</h3>
        <div class="tags">
            <div class="tag" onclick="toggleTag(this)">Floral</div>
            <div class="tag" onclick="toggleTag(this)">Citrus</div>
            <div class="tag" onclick="toggleTag(this)">Berry</div>
            <div class="tag" onclick="toggleTag(this)">Stone Fruit</div>
            <div class="tag" onclick="toggleTag(this)">Chocolate</div>
            <div class="tag" onclick="toggleTag(this)">Nutty</div>
            <div class="tag" onclick="toggleTag(this)">Caramel</div>
            <div class="tag" onclick="toggleTag(this)">Spicy</div>
        </div>

        <div class="total-score" id="totalScoreDisplay">Total: 86.00</div>

        <button class="submit-btn" onclick="submitNote()">평가 완료 및 결과 보기</button>
    </div>

    <!-- 대시보드 영역 (블라인드를 위해 처음엔 숨겨짐) -->
    <div class="dashboard-section" id="dashboardSection">
        <h2>📊 Team Calibration</h2>
        <div id="dashboardContainer">
            <!-- 제출된 결과가 여기에 표시됩니다 -->
        </div>
        <button class="submit-btn" style="background-color: #555; margin-top: 20px;" onclick="location.reload()">다음 샘플 평가하기 (새로고침)</button>
    </div>

    <script>
        const baseScore = 30; // Clean Cup, Sweetness, Uniformity 30점 기본값

        function updateScore(slider) {
            slider.nextElementSibling.innerText = parseFloat(slider.value).toFixed(2);
            calculateTotal();
        }

        function calculateTotal() {
            const sliders = document.querySelectorAll('.score-slider');
            let sum = baseScore;
            sliders.forEach(slider => {
                sum += parseFloat(slider.value);
            });
            document.getElementById('totalScoreDisplay').innerText = `Total: ${sum.toFixed(2)}`;
            return sum.toFixed(2);
        }

        function toggleTag(element) {
            element.classList.toggle('selected');
        }

        function submitNote() {
            const name = document.getElementById('cupperName').value;
            const beanInfo = document.getElementById('currentBeanInfo').innerText;
            
            if(!name) {
                alert("평가자 이름을 입력해주세요!");
                return;
            }

            const total = calculateTotal();
            const selectedTags = Array.from(document.querySelectorAll('.tag.selected'))
                                      .map(tag => tag.innerText).join(', ');

            // 카드 생성
            const cardHTML = `
                <div class="card">
                    <h3>${name} 님의 노트</h3>
                    <p><strong>점수:</strong> <span style="color: #d35400; font-weight: bold; font-size: 1.2em;">${total}</span></p>
                    <p><strong>Tasting Notes:</strong> ${selectedTags || '없음'}</p>
                </div>
            `;

            // 결과 화면에 카드 추가
            document.getElementById('dashboardContainer').innerHTML = cardHTML;

            // 폼 숨기고, 결과 화면 띄우기 (블라인드 오픈)
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            
            window.scrollTo(0, 0); // 화면 맨 위로 올리기
        }
    </script>
</body>
</html>
